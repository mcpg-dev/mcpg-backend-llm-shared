[package]
name = "mcpg-backend-llm-shared"
version = "0.1.0-beta.45"
license = "Apache-2.0"
edition = "2024"
description = "Provider-agnostic core for MCPG's per-provider LLM binding plugins: the canonical chat request/response and streaming shapes, the provider adapter traits, the shared chat engine (prompt rendering, tool-calling loop, JSON Schema validation, retries) and the shared config primitives. Provider wire formats live in the per-provider plugin crates."

[dependencies]
mcpg-backend-llm-types = { git = "https://github.com/mcpg-dev/mcpg-backend-llm-types", tag = "v0.1.0-beta.42", version = "=0.1.0-beta.42" }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.45", version = "=0.1.0-beta.45" }
mcpg-sensitive = { git = "https://github.com/mcpg-dev/mcpg-sensitive", tag = "v0.1.0-beta.42", version = "=0.1.0-beta.42" }
async-trait = "0.1"
base64 = "0.23"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
jsonschema = "0.28"
lru = "0.18"
metrics = "0.24"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "fs", "io-util"] }
tokio-stream = "0.1"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
