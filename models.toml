# MCPG vendored cost rate card.
#
# Updated separately from code. Bump `last_updated` whenever any
# entry changes; `schema_version` is reserved for the loader to
# refuse decoding incompatible files.
#
# Operators with custom rate cards (forwarding-resold pricing,
# negotiated discounts) override via `plugins.cost.rate_card_path`.
#
# Sources / last sync: provider public price pages as of date below.
# Models not listed cannot accumulate cost — bindings using them
# pass through with a debug log; budget caps that depend on cost
# are effectively off for those models (see `BudgetSpec`).

schema_version = 1
last_updated = "2026-04-30"

